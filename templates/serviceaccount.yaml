---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubekubevirt.fullname" . }}
  labels:
    {{- include "kubekubevirt.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubekubevirt.fullname" . }}
  labels:
    {{- include "kubekubevirt.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - 'secrets'
  verbs:
  - '*'
  #resourceNames:
  #  - {{ include "kubekubevirt.fullname" . }}-kubeadm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubekubevirt.fullname" . }}
  labels:
    {{- include "kubekubevirt.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubekubevirt.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubekubevirt.fullname" . }}
