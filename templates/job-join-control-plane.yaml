{{- range $vmIndex := until 1 (.Values.controlPlane.count | int) 1 }}
{{- with $ }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubekubevirt.fullname" . }}-join-controlplane-{{ $vmIndex }}
  labels:
    {{- include "kubekubevirt.labels" . | nindent 4 }}
    tier: controlplane
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create
          image: python:3.12
          args:
            - sh
            - -c
            - |-
              USER=ubuntu
              PASSWORD="$(cat /etc/kubekubevirt/ssh_password)"
              HOST={{ include "kubekubevirt.fullname" . }}-controlplane-{{ $vmIndex }}
              # TODO: SSH into controlplane-0 to get credentials
              # TODO: SSH into controlplane-$vmIndex and join cluster with kubeadm
          volumeMounts:
            - mountPath: /etc/kubekubevirt
              name: secret
      volumes:
        - name: secret
          secret:
            secretName: {{ include "kubekubevirt.fullname" . }}-ssh
{{- end }}
{{- end }}
